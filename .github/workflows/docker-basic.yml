name: Docker Build Basic

on:
  push:
    branches: [main]

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # --- Get code ---------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --- Set up Java and build JAR ----------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests -q

      # --- Set up Docker Buildx ---------------------------
      # Buildx = advanced Docker builder
      # Supports multi-platform, caching etc
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Login to Docker Hub ----------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Build and push ---------------------------------
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/springapp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/springapp:${{ github.run_number }}

      # --- Verify push ------------------------------------
      - name: Verify Image
        run: |
          docker pull \
            ${{ secrets.DOCKERHUB_USERNAME }}/springapp:latest
          docker inspect \
            ${{ secrets.DOCKERHUB_USERNAME }}/springapp:latest \
            | grep -E '"Architecture|"Os|Size"'
