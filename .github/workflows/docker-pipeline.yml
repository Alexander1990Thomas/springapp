name: Complete Docker Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/docker-pipeline.yml'
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx512m'
  IMAGE_NAME: springapp

jobs:

  # -- Job 1: Test -------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn clean verify --no-transfer-progress

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 3

  # -- Job 2: Build Docker Image -----------------------
  docker-build:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.tags.outputs.sha }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: |
          mvn package \
            -DskipTests \
            --no-transfer-progress \
            -q
          echo "Built: $(ls -lh target/*.jar)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          SHA=$(echo $GITHUB_SHA | cut -c1-7)
          NUM=${{ github.run_number }}
          BRANCH=${{ github.ref_name }}
          echo "sha=sha-${SHA}"        >> $GITHUB_OUTPUT
          echo "build=build-${NUM}"    >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}"      >> $GITHUB_OUTPUT
          echo ""
          echo "Tags generated:"
          echo "- sha-${SHA}"
          echo "- build-${NUM}"
          echo "- ${BRANCH}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=build-${{ github.run_number }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo ""                      >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |"       >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|"       >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.tags.outputs.sha }} |" \
            >> $GITHUB_STEP_SUMMARY
          echo "| Digest | ${{ steps.build.outputs.digest }} |" \
            >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" \
            >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" \
            >> $GITHUB_STEP_SUMMARY

  # -- Job 3: Security Scan ----------------------------
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request'

    steps:
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/springapp:${{ needs.docker-build.outputs.image-tag }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Scan for secrets
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/springapp:${{ needs.docker-build.outputs.image-tag }}
          scanners: secret
          exit-code: '1'

  # -- Job 4: Smoke Test -------------------------------
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request'

    steps:
      - name: Pull and run image
        run: |
          TAG="${{ needs.docker-build.outputs.image-tag }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/springapp:$TAG"
          
          echo "Pulling: $IMAGE"
          docker pull $IMAGE
          
          echo "Starting container..."
          docker run -d \
            --name smoke-test \
            -p 8080:8080 \
            $IMAGE

      - name: Wait for startup
        run: |
          echo "Waiting for app to start..."
          ATTEMPTS=0
          while [[ $ATTEMPTS -lt 12 ]]; do
            sleep 5
            ATTEMPTS=$((ATTEMPTS + 1))
            if curl -sf \
            http://localhost:8080/api/health \
            > /dev/null 2>&1; then
              echo "App is healthy after $((ATTEMPTS*5))s"
              break
            fi
            echo "Attempt $ATTEMPTS/12..."
            if [[ $ATTEMPTS -eq 12 ]]; then
              echo "App failed to start"
              docker logs smoke-test
              exit 1
            fi
          done

      - name: Run smoke tests
        run: |
          BASE="http://localhost:8080"
          echo "--- Smoke Tests ---"
          
          # Test 1: Home endpoint
          RESP=$(curl -sf $BASE/api/)
          echo "$RESP" | grep -q "running" && \
            echo "✓ Home endpoint" || \
            { echo "✗ Home endpoint"; exit 1; }
            
          # Test 2: Health endpoint
          RESP=$(curl -sf $BASE/api/health)
          echo "$RESP" | grep -q "healthy" && \
            echo "✓ Health endpoint" || \
            { echo "✗ Health endpoint"; exit 1; }

          # Test 3: Items endpoint
          curl -sf $BASE/api/items && \
            echo "✓ Items endpoint" || \
            { echo "✗ Items endpoint"; exit 1; }
            
          # Test 4: Add item
          RESP=$(curl -sf -X POST $BASE/api/items \
            -H "Content-Type: application/json" \
            -d '{"name":"smoke-test-item"}')
          echo "$RESP" | grep -q "id" && \
            echo "✓ Add item" || \
            { echo "✗ Add item"; exit 1; }
            
          # Test 5: Actuator health
          curl -sf \
            $BASE/actuator/health && \
            echo "✓ Actuator health" || \
            echo "⚠ Actuator not exposed"
            
          echo ""
          echo "All smoke tests passed!"

      - name: Show container logs
        if: always()
        run: docker logs smoke-test

      - name: Cleanup
        if: always()
        run: docker rm -f smoke-test

  # -- Job 5: Summary ----------------------------------
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [test, docker-build, scan, smoke-test]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "--- Pipeline Complete ---"
          echo "Test:       ${{ needs.test.result }}"
          echo "Docker:     ${{ needs.docker-build.result }}"
          echo "Scan:       ${{ needs.scan.result }}"
          echo "Smoke test: ${{ needs.smoke-test.result }}"
          echo ""
          echo "Image tag: ${{ needs.docker-build.outputs.image-tag }}"
          echo "Digest:    ${{ needs.docker-build.outputs.image-digest }}"
          
          # Fail if any critical job failed
          if [[ \
            "${{ needs.test.result }}" != "success" || \
            "${{ needs.docker-build.result }}" != "success" || \
            "${{ needs.smoke-test.result }}" != "success" \
          ]]; then
            echo ""
            echo "✗ Pipeline FAILED"
            exit 1
          fi
          
          echo ""
          echo "✓ Pipeline PASSED"
          echo "  Image ready for deployment"
