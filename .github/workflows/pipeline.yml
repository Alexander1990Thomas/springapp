name: Spring Boot CI Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests?'
        type: boolean
        default: false

env:
  JAVA_VERSION: '17'
  JAVA_DIST: 'temurin'
  MAVEN_OPTS: '-Xmx512m'

jobs:
  # --- Job 1: Test --------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
          cache: maven

      - name: Run tests
        run: mvn clean test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 3

  # --- Job 2: Build --------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    if: |
      always() &&
      (needs.test.result == 'success' ||
       needs.test.result == 'skipped')
    outputs:
      version: ${{ steps.version.outputs.version }}
      jar:     ${{ steps.version.outputs.jar }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
          cache: maven

      - name: Generate version
        id: version
        run: |
          SHA=$(echo $GITHUB_SHA | cut -c1-7)
          NUM=${{ github.run_number }}
          VERSION="1.0.${NUM}-${SHA}"
          JAR="springapp-${VERSION}.jar"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "jar=$JAR"         >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build JAR
        run: mvn package -DskipTests -q

      - name: Rename JAR
        run: |
          cd target
          JAR=$(ls *.jar | grep -v original | head -1)
          mv "$JAR" "${{ steps.version.outputs.jar }}"
          echo "Built: $(ls -lh *.jar)"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: springapp-jar
          path: target/${{ steps.version.outputs.jar }}
          retention-days: 5

      - name: Build summary
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |"      >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|"      >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.version }} |" \
            >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" \
            >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" \
            >> $GITHUB_STEP_SUMMARY
          echo "| Actor  | ${{ github.actor }} |" \
            >> $GITHUB_STEP_SUMMARY
          echo "| JAR    | ${{ steps.version.outputs.jar }} |" \
            >> $GITHUB_STEP_SUMMARY

  # --- Job 3: Summary ------------------
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "=== Pipeline Results ==="
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Version: ${{ needs.build.outputs.version }}"

          TEST="${{ needs.test.result }}"
          BUILD="${{ needs.build.result }}"

          if [[ ($TEST == "success" || $TEST == "skipped") \
            && $BUILD == "success" ]]; then
            echo ""
            echo "✅ Pipeline successful"
            echo "  Version: ${{ needs.build.outputs.version }}"
          else
            echo ""
            echo "❌ Pipeline failed"
            exit 1
          fi
