name: Spring Boot CI

# --- Triggers -----------------------
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# --- Global variables ----------------
env:
  JAVA_VERSION: '17'
  JAVA_DIST: 'temurin'

# --- Jobs ----------------------------
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      # Get your code onto the runner machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Java on the runner machine
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
          cache: maven       # cache ~/.m2 between runs

      # Build and run tests
      - name: Build and Test
        run: mvn clean verify

      # Show what was built
      - name: Show build output
        run: |
          echo "Build complete!"
          ls -lh target/*.jar 2>/dev/null || \
          echo "No JAR found"
          echo "Branch:  ${{ github.ref_name }}"
          echo "Commit:  ${{ github.sha }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Actor:   ${{ github.actor }}"
