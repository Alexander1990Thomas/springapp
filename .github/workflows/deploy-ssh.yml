name: Deploy via SSH

on:
  push:
    branches: [main]

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx512m'
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/springapp

jobs:

  # - Job 1: Test -------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn clean verify --no-transfer-progress

  # - Job 2: Build and Push ---------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Generate tag
        id: tag
        run: |
          SHA=$(echo $GITHUB_SHA | cut -c1-7)
          TAG="sha-$SHA"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

      - name: Build JAR
        run: mvn package -DskipTests -q

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # - Job 3: Deploy -----------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" \
            > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to server
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          SERVER="${{ secrets.SERVER_HOST }}"
          USER="${{ secrets.SERVER_USER }}"

          echo "Deploying $TAG to $SERVER"

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            $USER@$SERVER \
            "bash -x /opt/springapp/deploy.sh $TAG"

      - name: Verify deployment
        run: |
          SERVER="${{ secrets.SERVER_HOST }}"
          USER="${{ secrets.SERVER_USER }}"

          # Check health from server
          HEALTH=$(ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            $USER@$SERVER \
            "curl -sf http://localhost:8080/api/health")

          echo "Health response: $HEALTH"
          echo "$HEALTH" | grep -q "healthy" && \
            echo "✓ Deployment verified" || \
            ( echo "✗ Health check failed"; exit 1; )

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
